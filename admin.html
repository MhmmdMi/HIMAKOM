<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin HIMAKOM</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="js/firebase-config.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f0f4f8; min-height: 100vh; }

  /* LOGIN */
  #login-page {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 20px;
  }
  .login-card {
    background: white; border-radius: 16px; padding: 32px 24px;
    width: 100%; max-width: 360px; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .login-card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 16px; }
  .login-card h2 { color: #1a3a6b; margin-bottom: 4px; font-size: 20px; }
  .login-card p { color: #888; font-size: 13px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #ddd; font-size: 15px; margin-bottom: 12px;
    text-align: center; letter-spacing: 4px;
  }
  .login-card button {
    width: 100%; padding: 14px; background: #1a3a6b; color: white;
    border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
  }
  .login-card button:active { background: #0f2347; }
  .error-msg { color: red; font-size: 13px; margin-top: 8px; }

  /* ADMIN PANEL */
  #admin-page { display: none; }
  .topbar {
    background: #1a3a6b; color: white; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar h1 { font-size: 16px; }
  .topbar button {
    background: rgba(255,255,255,0.2); border: none; color: white;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }

  .tab-menu {
    display: flex; background: white; border-bottom: 2px solid #e0e0e0;
    overflow-x: auto;
  }
  .tab-btn {
    flex: 1; padding: 14px 8px; border: none; background: transparent;
    font-size: 13px; cursor: pointer; color: #888; white-space: nowrap;
    min-width: 80px;
  }
  .tab-btn.active { color: #1a3a6b; border-bottom: 3px solid #1a3a6b; font-weight: bold; }

  .tab-content { display: none; padding: 20px; }
  .tab-content.active { display: block; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #ddd; font-size: 14px;
  }
  .form-group textarea { height: 100px; resize: vertical; }

  .btn-simpan {
    width: 100%; padding: 14px; background: #1a3a6b; color: white;
    border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
    margin-top: 8px;
  }
  .btn-simpan:active { background: #0f2347; }
  .btn-simpan:disabled { background: #ccc; cursor: not-allowed; }

  .msg-sukses { color: green; text-align: center; margin-top: 12px; font-weight: bold; padding: 10px; background: #e8f5e9; border-radius: 8px; }
  .msg-gagal { color: red; text-align: center; margin-top: 12px; font-weight: bold; padding: 10px; background: #ffebee; border-radius: 8px; }

  .section-title {
    font-size: 16px; font-weight: bold; color: #1a3a6b;
    margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 2px solid #e0e0e0;
  }

  /* Daftar data */
  .data-list { margin-top: 20px; }
  .data-item {
    background: white; border-radius: 10px; padding: 14px;
    margin-bottom: 10px; border: 1px solid #e0e0e0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .data-item p { font-size: 14px; color: #333; }
  .data-item small { color: #888; font-size: 12px; }
  .btn-hapus {
    background: #ff4444; color: white; border: none;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }

  .file-input-group {
    border: 1px dashed #ccc;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    background: #fafafa;
  }
</style>
</head>
<body>

<!-- HALAMAN LOGIN -->
<div id="login-page">
  <div class="login-card">
    <img src="images/HIMAKOM.jpeg" alt="Logo HIMAKOM">
    <h2>Admin HIMAKOM</h2>
    <p>Masukkan password untuk masuk</p>
    <input type="password" id="password-input" placeholder="••••••••" onkeypress="if(event.key==='Enter') cekPassword()">
    <button onclick="cekPassword()">Masuk</button>
    <p class="error-msg" id="error-login"></p>
  </div>
</div>

<!-- HALAMAN ADMIN -->
<div id="admin-page">
  <div class="topbar">
    <h1>Admin Panel HIMAKOM</h1>
   <button onclick="window.history.back()">← Kembali</button>
<button onclick="keluar()">Keluar</button>
  </div>

  <div class="tab-menu">
    <button class="tab-btn active" onclick="bukaTab('berita', this)">Berita</button>
    <button class="tab-btn" onclick="bukaTab('galeri', this)">Galeri</button>
    <button class="tab-btn" onclick="bukaTab('pengurus', this)">Pengurus</button>
    <button class="tab-btn" onclick="bukaTab('info', this)">Info/Visi/Misi</button>
  </div>

  <!-- TAB BERITA -->
  <div id="tab-berita" class="tab-content active">
    <p class="section-title">Tambah Berita Baru</p>
    <div class="form-group">
      <label>Judul Berita</label>
      <input type="text" id="judul_berita" placeholder="Tulis judul berita...">
    </div>
    <div class="form-group">
      <label>Isi Berita</label>
      <textarea id="isi_berita" placeholder="Tulis isi berita..."></textarea>
    </div>
    <div class="form-group">
      <label>Tanggal</label>
      <input type="date" id="tgl_berita">
    </div>
    <div class="form-group">
      <label>Upload Gambar</label>
      <div class="file-input-group">
        <input type="file" id="file_berita" accept="image/*">
        <p style="font-size: 10px; color: #888; margin-top: 5px;">Atau masukkan URL di bawah</p>
      </div>
    </div>
    <div class="form-group">
      <label>URL Gambar (opsional)</label>
      <input type="text" id="img_berita" placeholder="https://...">
    </div>
    <button class="btn-simpan" id="btn_simpan_berita" onclick="tambahBerita()">Simpan Berita</button>
    <p id="msg_berita"></p>

    <div class="data-list" id="list_berita"></div>
  </div>

  <!-- TAB GALERI -->
  <div id="tab-galeri" class="tab-content">
    <p class="section-title">Tambah Foto Galeri</p>
    <div class="form-group">
      <label>Judul Foto</label>
      <input type="text" id="judul_galeri" placeholder="Nama kegiatan...">
    </div>
    <div class="form-group">
      <label>Upload Gambar</label>
      <div class="file-input-group">
        <input type="file" id="file_galeri" accept="image/*">
      </div>
    </div>
    <div class="form-group">
      <label>URL Gambar (opsional)</label>
      <input type="text" id="img_galeri" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Keterangan (opsional)</label>
      <input type="text" id="ket_galeri" placeholder="Keterangan foto...">
    </div>
    <button class="btn-simpan" id="btn_simpan_galeri" onclick="tambahGaleri()">Simpan Foto</button>
    <p id="msg_galeri"></p>

    <div class="data-list" id="list_galeri"></div>
  </div>

  <!-- TAB PENGURUS -->
  <div id="tab-pengurus" class="tab-content">
    <p class="section-title">Tambah Pengurus</p>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="nama_pgr" placeholder="Nama pengurus...">
    </div>
    <div class="form-group">
      <label>Jabatan</label>
      <input type="text" id="jabatan_pgr" placeholder="Ketua / Sekretaris / dll">
    </div>
    <div class="form-group">
      <label>NIM</label>
      <input type="text" id="nim_pgr" placeholder="Nomor induk mahasiswa...">
    </div>
    <div class="form-group">
      <label>Upload Foto</label>
      <div class="file-input-group">
        <input type="file" id="file_pgr" accept="image/*">
      </div>
    </div>
    <div class="form-group">
      <label>URL Foto (opsional)</label>
      <input type="text" id="foto_pgr" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Urutan Tampil (Angka)</label>
      <input type="number" id="urutan_pgr" value="1">
    </div>
    <button class="btn-simpan" id="btn_simpan_pgr" onclick="tambahPengurus()">Simpan Pengurus</button>
    <p id="msg_pgr"></p>

    <div class="data-list" id="list_pengurus"></div>
  </div>

  <!-- TAB INFO -->
  <div id="tab-info" class="tab-content">
    <p class="section-title">Edit Info Organisasi</p>
    <div class="form-group">
      <label>Visi</label>
      <textarea id="info_visi" placeholder="Visi organisasi..."></textarea>
    </div>
    <div class="form-group">
      <label>Profil / Tentang Kami</label>
      <textarea id="info_tentang" placeholder="Profil organisasi..."></textarea>
    </div>
    <div class="form-group">
      <label>Sejarah Singkat</label>
      <textarea id="info_sejarah" placeholder="Sejarah organisasi..."></textarea>
    </div>
    <button class="btn-simpan" onclick="simpanInfo()">Simpan Info</button>
    <p id="msg_info"></p>
  </div>
</div>

<script>
const PASSWORD_ADMIN = 'himakom2026'

function cekPassword() {
  const pass = document.getElementById('password-input').value
  if (pass === PASSWORD_ADMIN) {
    document.getElementById('login-page').style.display = 'none'
    document.getElementById('admin-page').style.display = 'block'
    muatData()
  } else {
    document.getElementById('error-login').innerText = 'Password salah! Coba lagi.'
  }
}

function keluar() {
  document.getElementById('login-page').style.display = 'flex'
  document.getElementById('admin-page').style.display = 'none'
  document.getElementById('password-input').value = ''
}

function bukaTab(nama, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'))
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
  document.getElementById('tab-' + nama).classList.add('active')
  btn.classList.add('active')
}

function tampilPesan(id, sukses, pesan) {
  const el = document.getElementById(id)
  el.className = sukses ? 'msg-sukses' : 'msg-gagal'
  el.innerText = pesan
  setTimeout(() => el.innerText = '', 3000)
}

// Helper Upload Image
async function uploadImage(file, folder) {
  if (!file) return null;
  const fileName = Date.now() + "_" + file.name;
  const storageRef = storage.ref().child(folder + "/" + fileName);
  await storageRef.put(file);
  return await storageRef.getDownloadURL();
}

// BERITA
async function tambahBerita() {
  const judul = document.getElementById('judul_berita').value;
  const isi = document.getElementById('isi_berita').value;
  const file = document.getElementById('file_berita').files[0];
  let url = document.getElementById('img_berita').value;

  if(!judul || !isi) return tampilPesan('msg_berita', false, 'Judul dan isi wajib diisi!');

  const btn = document.getElementById('btn_simpan_berita');
  btn.disabled = true;
  btn.innerText = "Mengunggah...";

  try {
    if (file) {
      url = await uploadImage(file, "berita");
    }

    await db.collection('berita').add({
      judul: judul,
      isi: isi,
      tanggal: document.getElementById('tgl_berita').value || new Date().toISOString().split('T')[0],
      gambar_url: url || null,
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    })
    tampilPesan('msg_berita', true, 'Berita berhasil disimpan!')
    document.getElementById('judul_berita').value = ''
    document.getElementById('isi_berita').value = ''
    document.getElementById('img_berita').value = ''
    document.getElementById('file_berita').value = ''
  } catch (error) {
    tampilPesan('msg_berita', false, 'Gagal: ' + error.message)
  } finally {
    btn.disabled = false;
    btn.innerText = "Simpan Berita";
  }
}

function muatBerita() {
  db.collection('berita').orderBy('created_at', 'desc').onSnapshot((snapshot) => {
    const el = document.getElementById('list_berita')
    el.innerHTML = '<p class="section-title" style="margin-top:20px">Data Berita</p>'
    if (snapshot.empty) { el.innerHTML += '<p style="color:#888;text-align:center">Belum ada berita</p>'; return }
    snapshot.forEach(doc => {
      const item = doc.data()
      el.innerHTML += `<div class="data-item">
        <div><p>${item.judul}</p><small>${item.tanggal || ''}</small></div>
        <button class="btn-hapus" onclick="hapus('berita', '${doc.id}')">Hapus</button>
      </div>`
    })
  })
}

// GALERI
async function tambahGaleri() {
  const file = document.getElementById('file_galeri').files[0];
  let url = document.getElementById('img_galeri').value;

  const btn = document.getElementById('btn_simpan_galeri');
  btn.disabled = true;
  btn.innerText = "Mengunggah...";

  try {
    if (file) {
      url = await uploadImage(file, "galeri");
    }

    await db.collection('galeri').add({
      judul: document.getElementById('judul_galeri').value,
      gambar_url: url || null,
      keterangan: document.getElementById('ket_galeri').value || null,
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    })
    tampilPesan('msg_galeri', true, 'Foto berhasil disimpan!')
    document.getElementById('judul_galeri').value = ''
    document.getElementById('img_galeri').value = ''
    document.getElementById('ket_galeri').value = ''
    document.getElementById('file_galeri').value = ''
  } catch (error) {
    tampilPesan('msg_galeri', false, 'Gagal: ' + error.message)
  } finally {
    btn.disabled = false;
    btn.innerText = "Simpan Foto";
  }
}

function muatGaleri() {
  db.collection('galeri').orderBy('created_at', 'desc').onSnapshot((snapshot) => {
    const el = document.getElementById('list_galeri')
    el.innerHTML = '<p class="section-title" style="margin-top:20px">Data Galeri</p>'
    if (snapshot.empty) { el.innerHTML += '<p style="color:#888;text-align:center">Belum ada foto</p>'; return }
    snapshot.forEach(doc => {
      const item = doc.data()
      el.innerHTML += `<div class="data-item">
        <div><p>${item.judul}</p><small>${item.keterangan || ''}</small></div>
        <button class="btn-hapus" onclick="hapus('galeri', '${doc.id}')">Hapus</button>
      </div>`
    })
  })
}

// PENGURUS
async function tambahPengurus() {
  const file = document.getElementById('file_pgr').files[0];
  let url = document.getElementById('foto_pgr').value;

  const btn = document.getElementById('btn_simpan_pgr');
  btn.disabled = true;
  btn.innerText = "Mengunggah...";

  try {
    if (file) {
      url = await uploadImage(file, "pengurus");
    }

    await db.collection('pengurus').add({
      nama: document.getElementById('nama_pgr').value,
      jabatan: document.getElementById('jabatan_pgr').value || null,
      nim: document.getElementById('nim_pgr').value || null,
      foto_url: url || null,
      urutan: parseInt(document.getElementById('urutan_pgr').value) || 1,
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    })
    tampilPesan('msg_pgr', true, 'Pengurus berhasil disimpan!')
    document.getElementById('nama_pgr').value = ''
    document.getElementById('jabatan_pgr').value = ''
    document.getElementById('nim_pgr').value = ''
    document.getElementById('foto_pgr').value = ''
    document.getElementById('file_pgr').value = ''
  } catch (error) {
    tampilPesan('msg_pgr', false, 'Gagal: ' + error.message)
  } finally {
    btn.disabled = false;
    btn.innerText = "Simpan Pengurus";
  }
}

function muatPengurus() {
  db.collection('pengurus').orderBy('urutan', 'asc').onSnapshot((snapshot) => {
    const el = document.getElementById('list_pengurus')
    el.innerHTML = '<p class="section-title" style="margin-top:20px">Data Pengurus</p>'
    if (snapshot.empty) { el.innerHTML += '<p style="color:#888;text-align:center">Belum ada pengurus</p>'; return }
    snapshot.forEach(doc => {
      const item = doc.data()
      el.innerHTML += `<div class="data-item">
        <div><p>${item.nama}</p><small>${item.jabatan || ''} - ${item.nim || ''}</small></div>
        <button class="btn-hapus" onclick="hapus('pengurus', '${doc.id}')">Hapus</button>
      </div>`
    })
  })
}

// INFO
async function simpanInfo() {
  try {
    await db.collection('info').doc('main').set({
      visi: document.getElementById('info_visi').value,
      tentang: document.getElementById('info_tentang').value,
      sejarah: document.getElementById('info_sejarah').value
    }, { merge: true })
    tampilPesan('msg_info', true, 'Info berhasil diperbarui!')
  } catch (error) {
    tampilPesan('msg_info', false, 'Gagal: ' + error.message)
  }
}

async function muatInfo() {
  const doc = await db.collection('info').doc('main').get()
  if (doc.exists) {
    const data = doc.data()
    document.getElementById('info_visi').value = data.visi || ''
    document.getElementById('info_tentang').value = data.tentang || ''
    document.getElementById('info_sejarah').value = data.sejarah || ''
  }
}

async function hapus(tabel, id) {
  if (!confirm('Hapus data ini?')) return
  try {
    await db.collection(tabel).doc(id).delete()
  } catch (error) {
    alert('Gagal menghapus: ' + error.message)
  }
}

function muatData() {
  muatBerita()
  muatGaleri()
  muatPengurus()
  muatInfo()
}
</script>
</body>
</html>
